# Every hour, opens a GitHub issue for each photo or shared model reported in the app, so the admin gets an
# email and can act within 24 hours (App Store guideline 1.2), and one for each Vietnamese name
# suggestion. Act with tools/moderate.py.
# Needs the FIREBASE_SERVICE_ACCOUNT_JSON secret (docs/release.md).
name: Moderation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: moderation
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open an issue per new report and name suggestion
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet google-cloud-firestore
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          gh label create moderation --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A photo reported in the app" 2>/dev/null || true
          gh label create name-suggestion --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "A Vietnamese name suggested in the app" 2>/dev/null || true
          python3 tools/moderate.py notify --repo "$GITHUB_REPOSITORY"
          rm -f "$RUNNER_TEMP/service-account.json"
