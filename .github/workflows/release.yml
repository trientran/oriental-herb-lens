# Builds signed releases and hands them to the stores, like a Bitrise release workflow:
#   - Android: an App Bundle uploaded to Google Play's internal track as a draft release. Finish
#     it in Play Console (release notes, rollout), then promote it.
#   - iOS: an archive uploaded to App Store Connect, where it appears in TestFlight once processed.
#   - Web: the site (home page, legal pages, the web app at /app/) published to Cloudflare Pages.
#
# Run it from the Actions tab (Release > Run workflow) with the version name, e.g. 2.0.
# The build number (Android versionCode, iOS CFBundleVersion) is the run number times 10, so it
# always grows. Set up the secrets first: docs/release.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown to users, e.g. 2.0
        required: true
      platforms:
        description: What to release
        type: choice
        options: [all, android-and-ios, android, ios, web]
        default: all

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_NAME: ${{ inputs.version_name }}
  BUILD_NUMBER: ${{ github.run_number }}0

jobs:
  android:
    if: contains(fromJSON('["all", "android-and-ios", "android"]'), inputs.platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Provide signing key and untracked build inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties

      - name: Build the signed App Bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PHOTO_UPLOAD_URL: ${{ secrets.PHOTO_UPLOAD_URL }}
        run: |
          ./gradlew :androidApp:bundleRelease -PversionCode="$BUILD_NUMBER" -PversionName="$VERSION_NAME" --console=plain
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload to Google Play (internal track, draft)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.uri.lee.dl
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          releaseName: ${{ inputs.version_name }} (${{ env.BUILD_NUMBER }})
          track: internal
          status: draft

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.BUILD_NUMBER }}
          path: androidApp/build/outputs/bundle/release/
          retention-days: 30

  ios:
    if: contains(fromJSON('["all", "android-and-ios", "ios"]'), inputs.platforms)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Provide Firebase config and the App Store Connect key
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          PHOTO_UPLOAD_URL: ${{ secrets.PHOTO_UPLOAD_URL }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          python3 tools/ios_secrets.py
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        working-directory: iosApp
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          pod install
          # Automatic signing in the cloud: the API key lets Xcode create the distribution
          # certificate and profile, so no certificates are kept in secrets
          xcodebuild archive -workspace iosApp.xcworkspace -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HerbLens.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tail -n 60

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HerbLens.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  web:
    if: contains(fromJSON('["all", "web"]'), inputs.platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the site
        env:
          PHOTO_UPLOAD_URL: ${{ secrets.PHOTO_UPLOAD_URL }}
        run: ./gradlew :webApp:site -PversionName="$VERSION_NAME" --console=plain

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy webApp/build/site --project-name med-herb-lens --branch main
